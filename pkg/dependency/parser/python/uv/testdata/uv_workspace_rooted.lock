version = 1

[manifest]
members = ["a", "b"]

[[package]]
name = "root"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "click" },
]

[[package]]
name = "a"
version = "0.1.0"
source = { editable = "src/a" }
dependencies = [
    { name = "requests" },
]

[package.dev-dependencies]
test = [{ name = "pytest" }]

[[package]]
name = "b"
version = "0.1.0"
source = { editable = "src/b" }
dependencies = [
    { name = "pillow" },
]

[package.dev-dependencies]
lint = [{ name = "ruff" }]

[[package]]
name = "click"
version = "8.1.7"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pillow"
version = "11.0.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "idna" },
]

[[package]]
name = "requests"
version = "2.32.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "urllib3" },
]

[[package]]
name = "pytest"
version = "8.3.4"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama" },
]

[[package]]
name = "ruff"
version = "0.9.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "tomli" },
]

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
