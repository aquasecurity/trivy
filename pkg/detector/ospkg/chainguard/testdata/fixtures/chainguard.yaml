- bucket: chainguard
  pairs:
    - bucket: glibc
      pairs:
        # Fixed in the same version on both architectures.
        - key: CVE-2023-4911
          value:
            FixedVersion: 2.38-r5
            Entries:
              - FixedVersion: 2.38-r5
                Arches:
                  - aarch64
                  - x86_64
                VendorIDs:
                  - CGA-2222-2222-2222
        # Recorded for x86_64 only. Status 6 is fix_deferred.
        - key: CVE-2026-12345
          value:
            Entries:
              - Status: 6
                Arches:
                  - x86_64
                VendorIDs:
                  - CGA-3333-3333-3333
        # Fixed in a different revision on each architecture.
        - key: CVE-2026-54321
          value:
            FixedVersion: 2.43-r0
            Entries:
              - FixedVersion: 2.40-r0
                Arches:
                  - aarch64
                VendorIDs:
                  - CGA-5555-5555-5555
              - FixedVersion: 2.43-r0
                Arches:
                  - x86_64
                VendorIDs:
                  - CGA-6666-6666-6666
    - bucket: openssl
      pairs:
        - key: CVE-2024-9143
          value:
            FixedVersion: 3.3.3-r0
            Entries:
              - FixedVersion: 3.3.3-r0
                VendorIDs:
                  - CGA-4444-4444-4444
    # The feed also files advisories against the subpackage that ships the
    # vulnerable component, not only against the origin package.
    - bucket: libcrypto3
      pairs:
        - key: CVE-2026-11111
          value:
            FixedVersion: 3.6.0-r0
            Entries:
              - FixedVersion: 3.6.0-r0
                VendorIDs:
                  - CGA-7777-7777-7777
- bucket: data-source
  pairs:
    - key: chainguard
      value:
        ID: chainguard
        Name: Chainguard Security Data
        URL: https://advisories.cgr.dev/chainguard/v3/osv/all.json
