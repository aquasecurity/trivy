# RapidFort advisories, one bucket per distribution: Red Hat, Oracle Linux,
# Rocky and Alma (elN), Amazon (amznN) and Fedora (fcNN) each get their own
# bucket, alongside Ubuntu, Debian and Alpine. Each bucket holds a single
# distribution's ranges.
#
# RapidFort's own rebuilds (rf) are split one bucket per feed — "rapidfort Red
# Hat", "rapidfort Oracle Linux", "rapidfort rocky", "rapidfort alma", "rapidfort
# amazon linux", "rapidfort debian", "rapidfort ubuntu" — so that RPM and dpkg
# ranges never share a bucket (the wrong comparator would read them) and so
# feeds that publish differing ranges for the same rebuild cannot overwrite each
# other. Every rf bucket below carries a different fix version, so a test that
# lands in the wrong one fails on the reported FixedVersion instead of passing
# by accident.
- bucket: rapidfort ubuntu 22.04
  pairs:
    - bucket: curl
      pairs:
        - key: CVE-2023-38545
          value:
            VulnerableVersions:
              - "<7.81.0-1ubuntu1.15"
            PatchedVersions:
              - "7.81.0-1ubuntu1.15"
            Severity: 3
        - key: CVE-2023-38039
          value:
            VulnerableVersions:
              - "<7.81.0-1ubuntu1.14"
            PatchedVersions:
              - "7.81.0-1ubuntu1.14"
            Severity: 2
    # ubuntu-tagged Ubuntu range for the rf-binutils package: shows the split
    # keeps the ubuntu fix in the Ubuntu bucket so a plain-ubuntu package
    # can't cross-match the "rapidfort ubuntu" bucket's rf-tagged range.
    - bucket: rf-binutils
      pairs:
        - key: CVE-2025-69648
          value:
            VulnerableVersions:
              - ">=0:2.42-4ubuntu2.10, <0:2.46-1ubuntu1"
            PatchedVersions:
              - "0:2.46-1ubuntu1"
            Severity: 2
- bucket: rapidfort alpine 3.18
  pairs:
    - bucket: libssl3
      pairs:
        - key: CVE-2023-5678
          value:
            VulnerableVersions:
              - "<3.1.4-r1"
            PatchedVersions:
              - "3.1.4-r1"
            Severity: 2
- bucket: rapidfort Red Hat 8
  pairs:
