# RapidFort's own dpkg rebuilds inside a Debian image. The Debian feed annotates
# no identifiers, so the DB build attributes these by the rebuild marker in the
# version string; the fix here is deliberately distinct from the versioned
# "rapidfort debian 12" bucket's so a misroute is visible.
- bucket: rapidfort debian
  pairs:
    - bucket: rf-git
      pairs:
        - key: CVE-2025-27614
          value:
            VulnerableVersions:
              - ">=0:0, <0:2.48.2-0rfubu"
            PatchedVersions:
              - "0:2.48.2-0rfubu"
            Severity: 2
    # A real rf-perl range from the Debian feed: the rebuild is introduced as a
    # "+rf" revision and fixed as a ".rf" build. Neither spelling contains
    # "rfubu", and the ".rf" one contains no "+rf" either, so both shapes have
    # to reach this bucket.
    - bucket: rf-perl
      pairs:
        - key: CVE-2024-56406
          value:
            VulnerableVersions:
              - ">=0:5.40.1-12+rf.0, <0:5.42.3-11.rf"
            PatchedVersions:
              - "0:5.42.3-11.rf"
            Severity: 2
