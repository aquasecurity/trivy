# RapidFort advisories, one bucket per distribution: Red Hat (elN), Fedora
# (fcNN) and RapidFort (rf) each get their own bucket, alongside Ubuntu and
# Alpine. Each bucket holds a single distribution's ranges.
- bucket: rapidfort ubuntu 22.04
  pairs:
    - bucket: curl
      pairs:
        - key: CVE-2023-38545
          value:
            VulnerableVersions:
              - "<7.81.0-1ubuntu1.15"
            PatchedVersions:
              - "7.81.0-1ubuntu1.15"
            Severity: 3
        - key: CVE-2023-38039
          value:
            VulnerableVersions:
              - "<7.81.0-1ubuntu1.14"
            PatchedVersions:
              - "7.81.0-1ubuntu1.14"
            Severity: 2
    # ubuntu-tagged Ubuntu range for the rf-binutils package: shows the split
    # keeps the ubuntu fix in the Ubuntu bucket so a plain-ubuntu package
    # can't cross-match the "rapidfort ubuntu" bucket's rf-tagged range.
    - bucket: rf-binutils
      pairs:
        - key: CVE-2025-69648
          value:
            VulnerableVersions:
              - ">=0:2.42-4ubuntu2.10, <0:2.46-1ubuntu1"
            PatchedVersions:
              - "0:2.46-1ubuntu1"
            Severity: 2
- bucket: rapidfort alpine 3.18
  pairs:
    - bucket: libssl3
      pairs:
        - key: CVE-2023-5678
          value:
            VulnerableVersions:
              - "<3.1.4-r1"
            PatchedVersions:
              - "3.1.4-r1"
            Severity: 2
- bucket: rapidfort Red Hat 8
  pairs:
    - bucket: curl
      pairs:
        - key: CVE-2023-EL8-ONLY
          value:
            VulnerableVersions:
              - ">=7.61.1-14.el8, <7.61.1-30.el8"
            PatchedVersions:
              - "7.61.1-30.el8"
            Severity: 2
- bucket: rapidfort Red Hat 9
  pairs:
    - bucket: curl
      pairs:
        - key: CVE-2023-27536
          value:
            VulnerableVersions:
              - ">=7.76.1-14.el9, <7.76.1-26.el9_3.3"
            PatchedVersions:
              - "7.76.1-26.el9_3.3"
            Severity: 2
        - key: CVE-2024-99999
          value:
            VulnerableVersions:
              - ">=7.76.1-14.el9"
            PatchedVersions: []
            Severity: 3
    # SRPM bucket (queried by pkg.SrcName).
    - bucket: rust-rpm-sequoia
      pairs:
        - key: CVE-2025-0977
          value:
            VulnerableVersions:
              - "<1.8.0-2.el9"
            PatchedVersions:
              - "1.8.0-2.el9"
            Severity: 3
        - key: CVE-2025-OVERLAP
          value:
            VulnerableVersions:
              - "<1.9.0-1.el9"
            PatchedVersions:
              - "1.9.0-1.el9"
            Severity: 3
    # Binary bucket (queried by pkg.Name when it differs from pkg.SrcName).
    - bucket: rpm-sequoia
      pairs:
        - key: CVE-2026-2625
          value:
            VulnerableVersions:
              - "<1.10.0-1.el9"
            PatchedVersions:
              - "1.10.0-1.el9"
            Severity: 2
        # Same CVE as the SRPM bucket, deliberately wrong so the dedupe test
        # can prove the SRPM entry wins.
        - key: CVE-2025-OVERLAP
          value:
            VulnerableVersions:
              - "<99.99.99-1.el9"
            PatchedVersions:
              - "99.99.99-1.el9"
            Severity: 1
