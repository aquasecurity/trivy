      pairs:
        - key: CVE-2023-EL8-ONLY
          value:
            VulnerableVersions:
              - ">=7.61.1-14.el8, <7.61.1-30.el8"
            PatchedVersions:
              - "7.61.1-30.el8"
            Severity: 2
- bucket: rapidfort Red Hat 9
  pairs:
    - bucket: curl
      pairs:
        - key: CVE-2023-27536
          value:
            VulnerableVersions:
              - ">=7.76.1-14.el9, <7.76.1-26.el9_3.3"
            PatchedVersions:
              - "7.76.1-26.el9_3.3"
            Severity: 2
        - key: CVE-2024-99999
          value:
            VulnerableVersions:
              - ">=7.76.1-14.el9"
            PatchedVersions: []
            Severity: 3
    # SRPM bucket (queried by pkg.SrcName).
    - bucket: rust-rpm-sequoia
      pairs:
        - key: CVE-2025-0977
          value:
            VulnerableVersions:
              - "<1.8.0-2.el9"
            PatchedVersions:
              - "1.8.0-2.el9"
            Severity: 3
        - key: CVE-2025-OVERLAP
          value:
            VulnerableVersions:
              - "<1.9.0-1.el9"
            PatchedVersions:
              - "1.9.0-1.el9"
            Severity: 3
    # Binary bucket (queried by pkg.Name when it differs from pkg.SrcName).
    - bucket: rpm-sequoia
      pairs:
        - key: CVE-2026-2625
          value:
            VulnerableVersions:
              - "<1.10.0-1.el9"
            PatchedVersions:
              - "1.10.0-1.el9"
            Severity: 2
        # Same CVE as the SRPM bucket, deliberately wrong so the dedupe test
        # can prove the SRPM entry wins.
        - key: CVE-2025-OVERLAP
          value:
            VulnerableVersions:
              - "<99.99.99-1.el9"
            PatchedVersions:
              - "99.99.99-1.el9"
            Severity: 1
