name: Automatic Backporting
run-name: "Backport #${{ inputs.pr-number }} to ${{ inputs.branch }}"

# Only users with write access to the repository can run a workflow_dispatch workflow,
# so no separate permission check is needed.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Number of the merged PR to backport
        required: true
        type: number
      branch:
        description: Target release branch (e.g. release/v0.50)
        required: true
        type: string

# github.token is only used to read the PR; checkout and backport.sh use the GitHub App token.
permissions:
  contents: read
  pull-requests: read

jobs:
  backport:
    name: Backport PR
    runs-on: ubuntu-2404-2core
    steps:
      - name: Validate inputs
        env:
          GH_TOKEN: ${{ github.token }} # required by gh api
          PR_NUMBER: ${{ inputs.pr-number }}
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          # Always run backport.sh from main, regardless of the ref selected in "Use workflow from".
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Error: the workflow must be run from main, got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Error: invalid PR number: $PR_NUMBER" >&2
            exit 1
          fi
          if [[ "$BRANCH_NAME" == *".."* || ! "$BRANCH_NAME" =~ ^release/[A-Za-z0-9._-]+$ ]]; then
            echo "Error: invalid release branch name: $BRANCH_NAME" >&2
            exit 1
          fi
          MERGED=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged and .base.ref == "main"')
          if [[ "$MERGED" != "true" ]]; then
            echo "Error: PR #$PR_NUMBER is not merged into main" >&2
            exit 1
          fi

      # GITHUB_TOKEN cannot trigger workflows on PRs it creates, so the backport
      # PR would not run CI — generate a GitHub App installation token instead.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REPO_TRIVY_WRITE_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_TRIVY_WRITE_GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # backport.sh runs git push
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Git user
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run backport script
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BRANCH_NAME: ${{ inputs.branch }}
        run: ./misc/backport/backport.sh "$BRANCH_NAME" "$PR_NUMBER"
